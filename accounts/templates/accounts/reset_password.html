<!-- accounts/templates/accounts/reset_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — BillBuzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1b2e5e;       /* match colors.primaryContainer */
    --secondary: #eef1fb;     /* match colors.secondaryContainer */
    --on-secondary: #1b2e5e;
    --surface: #f7f8fa;
    --white: #ffffff;
    --on-surface: #1a1a1f;
    --on-surface-variant: #6b7280;
    --border: #e9ecef;
    --error: #c62828;
    --error-bg: #fdecea;
    --success: #2e7d32;
    --success-bg: #e8f5e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--white);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 32px 28px;
    box-shadow: 0 8px 24px rgba(27, 46, 94, 0.08);
  }
  .logo {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--on-surface);
    text-align: center;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--on-surface-variant);
    text-align: center;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--on-surface-variant);
    margin-bottom: 8px;
  }
  .field-wrap { position: relative; margin-bottom: 18px; }
  input[type="password"], input[type="text"] {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    padding: 0 44px 0 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--on-surface);
    outline: none;
  }
  input:focus { border-color: var(--primary); }
  .toggle-visibility {
    position: absolute;
    right: 12px;
    top: 34px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 12px;
    color: var(--on-surface-variant);
    font-weight: 600;
    font-family: inherit;
  }
  button[type="submit"] {
    width: 100%;
    height: 50px;
    border-radius: 14px;
    background: var(--primary);
    color: var(--white);
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .status.error { display: block; background: var(--error-bg); color: var(--error); }
  .status.success { display: block; background: var(--success-bg); color: var(--success); }
  .hint {
    font-size: 11px;
    color: var(--on-surface-variant);
    margin: -10px 0 18px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">BillBuzz</div>
    <h1>Reset your password</h1>
    <p class="subtitle" id="subtitle">Choose a new password for your account.</p>

    <form id="reset-form">
      <label for="new_password">New Password</label>
      <div class="field-wrap">
        <input type="password" id="new_password" name="new_password" minlength="6" required autocomplete="new-password">
        <button type="button" class="toggle-visibility" data-target="new_password">Show</button>
      </div>
      <p class="hint">At least 6 characters.</p>

      <label for="new_password_confirm">Confirm New Password</label>
      <div class="field-wrap">
        <input type="password" id="new_password_confirm" name="new_password_confirm" minlength="6" required autocomplete="new-password">
        <button type="button" class="toggle-visibility" data-target="new_password_confirm">Show</button>
      </div>

      <button type="submit" id="submit-btn">Reset Password</button>
    </form>

    <div class="status" id="status"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const form = document.getElementById('reset-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');
  const subtitle = document.getElementById('subtitle');

  if (!token) {
    subtitle.textContent = 'This reset link is missing its token.';
    form.style.display = 'none';
    statusEl.className = 'status error';
    statusEl.textContent = 'Invalid link — please request a new password reset from the BillBuzz app.';
  }

  document.querySelectorAll('.toggle-visibility').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? 'Show' : 'Hide';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('new_password_confirm').value;

    if (newPassword !== confirmPassword) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Passwords do not match.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting…';
    statusEl.className = 'status';
    statusEl.textContent = '';

    try {
      const res = await fetch('/api/users/password_reset/confirm/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          newPassword: newPassword,
          newPasswordConfirm: confirmPassword,
        }),
      });
      const data = await res.json();

      if (res.ok) {
        form.style.display = 'none';
        statusEl.className = 'status success';
        statusEl.textContent = 'Your password has been reset. You can now log in from the BillBuzz app.';
      } else {
        statusEl.className = 'status error';
        statusEl.textContent =
          data.newPassword?.[0] || data.token?.[0] || data.detail || 'Something went wrong. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    } catch {
      statusEl.className = 'status error';
      statusEl.textContent = 'Network error. Please check your connection and try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  });
</script>

</body>
</html>
